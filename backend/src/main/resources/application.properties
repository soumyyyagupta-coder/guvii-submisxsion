spring.application.name=courserec-backend
server.port=8080

# Default local database: persistent H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:file:./data/courserecdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# H2 console (disabled by default)
spring.h2.console.enabled=false
